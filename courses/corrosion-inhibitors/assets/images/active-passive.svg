<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
<title id="t">Conceptual active-passive polarization curve</title><desc id="d">An anodic current versus potential diagram showing active dissolution, critical current, passive current and transpassive or breakdown region.</desc>
<rect width="900" height="500" fill="#fffdf8"/>
<line x1="110" y1="430" x2="830" y2="430" stroke="#0b1f35" stroke-width="3"/>
<line x1="110" y1="430" x2="110" y2="55" stroke="#0b1f35" stroke-width="3"/>
<text x="470" y="478" text-anchor="middle" font-family="Segoe UI" font-size="22" fill="#0b1f35">Potential → · الجهد</text>
<text x="32" y="255" transform="rotate(-90 32 255)" text-anchor="middle" font-family="Segoe UI" font-size="22" fill="#0b1f35">log anodic current → · لوغاريتم التيار الأنودي</text>
<path d="M145 400 C220 365 290 300 350 145 C365 105 392 115 404 190 C418 275 450 320 560 315 L690 312 C745 305 770 240 790 120" fill="none" stroke="#9f2e2e" stroke-width="7"/>
<line x1="350" y1="145" x2="350" y2="430" stroke="#c79a3b" stroke-dasharray="8 8" stroke-width="3"/>
<line x1="560" y1="315" x2="560" y2="430" stroke="#1f7a55" stroke-dasharray="8 8" stroke-width="3"/>
<text x="240" y="245" font-family="Segoe UI" font-size="22" fill="#7d2222">Active dissolution</text><text x="235" y="275" font-family="Tahoma" font-size="19" fill="#7d2222">الذوبان النشط</text>
<text x="370" y="95" font-family="Cambria Math" font-size="22" fill="#795a17">i₍crit₎</text>
<text x="555" y="285" font-family="Cambria Math" font-size="22" fill="#14583d">i₍pass₎</text>
<text x="505" y="365" font-family="Segoe UI" font-size="22" fill="#14583d">Passive region · مجال التخميل</text>
<text x="700" y="105" font-family="Segoe UI" font-size="20" fill="#7d2222">Breakdown / transpassive</text><text x="710" y="132" font-family="Tahoma" font-size="18" fill="#7d2222">الانهيار أو ما بعد التخميل</text>
