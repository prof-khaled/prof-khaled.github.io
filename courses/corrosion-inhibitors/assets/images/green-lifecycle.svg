<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" role="img" aria-labelledby="t d">
<title id="t">Life-cycle evaluation of a green corrosion inhibitor</title><desc id="d">A circular sequence from raw material and manufacture to formulation, use, corrosion prevention, discharge and end-of-life assessment.</desc>
<rect width="950" height="500" fill="#fffdf8"/>
<circle cx="475" cy="250" r="95" fill="#eaf6ef" stroke="#1f7a55" stroke-width="4"/>
<text x="475" y="226" text-anchor="middle" font-family="Segoe UI" font-size="22" fill="#14583d">Adequate protection</text><text x="475" y="255" text-anchor="middle" font-family="Tahoma" font-size="19" fill="#14583d">حماية كافية</text><text x="475" y="288" text-anchor="middle" font-family="Segoe UI" font-size="18" fill="#14583d">+ lower burden</text>
<g font-family="Segoe UI" font-size="18" text-anchor="middle">
<rect x="400" y="30" width="150" height="62" rx="14" fill="#edf5fb" stroke="#3c7da6" stroke-width="3"/><text x="475" y="57">Raw material</text><text x="475" y="81">المادة الخام</text>
<rect x="690" y="110" width="170" height="62" rx="14" fill="#f8f2e5" stroke="#c79a3b" stroke-width="3"/><text x="775" y="137">Manufacture</text><text x="775" y="161">التصنيع</text>
<rect x="720" y="310" width="170" height="62" rx="14" fill="#f1e8f8" stroke="#754c8f" stroke-width="3"/><text x="805" y="337">Use & exposure</text><text x="805" y="361">الاستخدام والتعرض</text>
<rect x="390" y="410" width="170" height="62" rx="14" fill="#fff1df" stroke="#a65c13" stroke-width="3"/><text x="475" y="437">Waste / recovery</text><text x="475" y="461">النفايات والاسترداد</text>
<rect x="70" y="310" width="180" height="62" rx="14" fill="#eaf6ef" stroke="#1f7a55" stroke-width="3"/><text x="160" y="337">Avoided damage</text><text x="160" y="361">الضرر المتجنب</text>
<rect x="90" y="110" width="180" height="62" rx="14" fill="#fbe8e8" stroke="#9f2e2e" stroke-width="3"/><text x="180" y="137">Environmental fate</text><text x="180" y="161">المصير البيئي</text>
</g>
