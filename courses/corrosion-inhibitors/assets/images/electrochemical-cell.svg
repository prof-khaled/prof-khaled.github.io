<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d">
<title id="t">Coupled anodic and cathodic reactions</title><desc id="d">A conceptual steel surface showing an anodic region dissolving iron, a cathodic oxygen reduction region, electron flow through the metal and ion movement through the electrolyte.</desc>
<rect width="900" height="420" fill="#fffdf8"/>
<rect x="80" y="235" width="740" height="92" rx="12" fill="#74879b" stroke="#0b1f35" stroke-width="3"/>
<rect x="80" y="65" width="740" height="150" rx="22" fill="#dcecf4" stroke="#3c7da6" stroke-width="2"/>
<text x="450" y="98" text-anchor="middle" font-family="Segoe UI" font-size="24" fill="#0b1f35">Electrolyte · الإلكتروليت</text>
<circle cx="260" cy="260" r="48" fill="#f2c6c6" stroke="#9f2e2e" stroke-width="4"/>
<circle cx="650" cy="260" r="48" fill="#cde9dc" stroke="#1f7a55" stroke-width="4"/>
<text x="260" y="254" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="700" fill="#7d2222">ANODE</text>
<text x="260" y="280" text-anchor="middle" font-family="Tahoma" font-size="18" fill="#7d2222">الأنود</text>
<text x="650" y="254" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="700" fill="#14583d">CATHODE</text>
<text x="650" y="280" text-anchor="middle" font-family="Tahoma" font-size="18" fill="#14583d">الكاثود</text>
<path d="M310 300 C410 360 520 360 600 300" fill="none" stroke="#f7d36f" stroke-width="7" marker-end="url(#a)"/>
<text x="455" y="378" text-anchor="middle" font-family="Segoe UI" font-size="20" fill="#0b1f35">Electron flow · تدفق الإلكترونات</text>
<path d="M250 210 C220 170 225 145 240 120" fill="none" stroke="#9f2e2e" stroke-width="4" marker-end="url(#r)"/>
<text x="110" y="145" font-family="Cambria Math" font-size="22" fill="#7d2222">Fe → Fe²⁺ + 2e⁻</text>
<path d="M650 210 C680 170 675 145 660 120" fill="none" stroke="#1f7a55" stroke-width="4" marker-end="url(#g)"/>
<text x="560" y="145" font-family="Cambria Math" font-size="20" fill="#14583d">O₂ + 2H₂O + 4e⁻ → 4OH⁻</text>
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#f7d36f"/></marker>
