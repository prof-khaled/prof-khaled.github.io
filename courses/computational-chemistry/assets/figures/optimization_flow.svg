<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img">
<style>text{font-family:Arial,sans-serif;fill:#10243e}.t{font-size:28px;font-weight:700}.s{font-size:20px}.box{fill:#f7f2e8;stroke:#c7a85b;stroke-width:3}.navy{fill:#10243e}.gold{fill:#c7a85b}.line{stroke:#10243e;stroke-width:4;fill:none}.dash{stroke:#778;stroke-width:3;fill:none;stroke-dasharray:10 8}</style>
<text x="500" y="45" text-anchor="middle" class="t">Geometry optimization and stationary-point verification</text>
<rect x="80" y="120" width="220" height="90" rx="18" class="box"/><text x="190" y="155" text-anchor="middle" class="s">Starting geometry</text><text x="190" y="183" text-anchor="middle" class="s">coordinates q</text>
<rect x="390" y="120" width="220" height="90" rx="18" class="box"/><text x="500" y="155" text-anchor="middle" class="s">Evaluate E(q), ∇E</text><text x="500" y="183" text-anchor="middle" class="s">and Hessian estimate</text>
<rect x="700" y="120" width="220" height="90" rx="18" class="box"/><text x="810" y="155" text-anchor="middle" class="s">Choose step Δq</text><text x="810" y="183" text-anchor="middle" class="s">Newton / quasi-Newton</text>
<rect x="390" y="325" width="220" height="90" rx="18" class="box"/><text x="500" y="360" text-anchor="middle" class="s">Converged stationary point?</text><text x="500" y="388" text-anchor="middle" class="s">forces & displacement small</text>
<rect x="80" y="325" width="220" height="90" rx="18" class="box"/><text x="190" y="360" text-anchor="middle" class="s">Frequency analysis</text><text x="190" y="388" text-anchor="middle" class="s">diagonalize mass-weighted H</text>
<rect x="700" y="325" width="220" height="90" rx="18" class="box"/><text x="810" y="360" text-anchor="middle" class="s">Interpret</text><text x="810" y="388" text-anchor="middle" class="s">0 imag → minimum; 1 → TS</text>
<path d="M300 165H390 M610 165H700 M810 210V275H500V325 M390 370H300 M300 370H700" class="line"/>
<text x="500" y="500" text-anchor="middle" class="s">A converged optimization is not enough: the Hessian tells you what stationary point you found.</text></svg>