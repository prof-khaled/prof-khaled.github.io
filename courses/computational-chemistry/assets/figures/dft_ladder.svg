<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img">
<style>text{font-family:Arial,sans-serif;fill:#10243e}.t{font-size:28px;font-weight:700}.s{font-size:20px}.box{fill:#f7f2e8;stroke:#c7a85b;stroke-width:3}.navy{fill:#10243e}.gold{fill:#c7a85b}.line{stroke:#10243e;stroke-width:4;fill:none}.dash{stroke:#778;stroke-width:3;fill:none;stroke-dasharray:10 8}</style>
<text x="500" y="45" text-anchor="middle" class="t">A practical view of Jacob's ladder of DFT</text>
<g class="s"><rect x="120" y="405" width="760" height="65" rx="12" class="box"/><text x="150" y="445">1. LDA — density ρ(r)</text>
<rect x="180" y="325" width="700" height="65" rx="12" class="box"/><text x="210" y="365">2. GGA — ρ + ∇ρ</text>
<rect x="240" y="245" width="640" height="65" rx="12" class="box"/><text x="270" y="285">3. meta-GGA — adds kinetic-energy density / ∇²ρ</text>
<rect x="300" y="165" width="580" height="65" rx="12" class="box"/><text x="330" y="205">4. hybrids — mix exact exchange</text>
<rect x="360" y="85" width="520" height="65" rx="12" class="box"/><text x="390" y="125">5. double hybrids — add perturbative correlation</text></g>
<path d="M105 470V90" class="line" marker-end="url(#u)"/><text x="25" y="275" transform="rotate(-90 25 275)" class="s">increasing nonlocality / cost</text>
<defs><marker id="u" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" class="navy"/></marker></defs>
<text x="500" y="530" text-anchor="middle" class="s">Dispersion corrections and range separation are additional design choices, not separate rungs.</text></svg>