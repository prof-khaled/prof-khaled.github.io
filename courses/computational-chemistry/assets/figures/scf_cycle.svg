<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img">
<style>text{font-family:Arial,sans-serif;fill:#10243e}.t{font-size:28px;font-weight:700}.s{font-size:20px}.box{fill:#f7f2e8;stroke:#c7a85b;stroke-width:3}.navy{fill:#10243e}.gold{fill:#c7a85b}.line{stroke:#10243e;stroke-width:4;fill:none}.dash{stroke:#778;stroke-width:3;fill:none;stroke-dasharray:10 8}</style>
<text x="500" y="45" text-anchor="middle" class="t">Self-consistent field (SCF) cycle</text>
<rect x="70" y="100" width="230" height="80" rx="18" class="box"/><text x="185" y="133" text-anchor="middle" class="s">Initial density / orbitals</text><text x="185" y="160" text-anchor="middle" class="s">P⁽⁰⁾</text>
<rect x="385" y="100" width="230" height="80" rx="18" class="box"/><text x="500" y="135" text-anchor="middle" class="s">Build Fock matrix</text><text x="500" y="160" text-anchor="middle" class="s">F = Hcore + G[P]</text>
<rect x="700" y="100" width="230" height="80" rx="18" class="box"/><text x="815" y="135" text-anchor="middle" class="s">Diagonalize</text><text x="815" y="160" text-anchor="middle" class="s">FC = SCε</text>
<rect x="700" y="320" width="230" height="80" rx="18" class="box"/><text x="815" y="355" text-anchor="middle" class="s">New orbitals & density</text><text x="815" y="382" text-anchor="middle" class="s">C → P⁽ⁿ⁺¹⁾</text>
<rect x="385" y="320" width="230" height="80" rx="18" class="box"/><text x="500" y="355" text-anchor="middle" class="s">Convergence test</text><text x="500" y="382" text-anchor="middle" class="s">ΔE, ΔP, orbital gradient</text>
<rect x="70" y="320" width="230" height="80" rx="18" class="box"/><text x="185" y="355" text-anchor="middle" class="s">Converged solution</text><text x="185" y="382" text-anchor="middle" class="s">Energy + properties</text>
<path d="M300 140H385 M615 140H700 M815 180V320 M700 360H615 M385 360H300" class="line" marker-end="url(#a)"/><path d="M500 320V245H185V180" class="dash" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" class="navy"/></marker></defs>
<text x="500" y="470" text-anchor="middle" class="s">If not converged, mix/damp/extrapolate the density and repeat.</text></svg>