<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="t d"><title id="t">Electronic structure hierarchy</title><desc id="d">Conceptual ladder from Hartree-Fock through MP2, configuration interaction, coupled cluster, and multireference methods, comparing cost and correlation.</desc><rect width="980" height="500" fill="#fffefa"/><text x="490" y="44" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#101a37">Recovering electron correlation: a conceptual method ladder</text><g font-family="Arial" font-size="18"><rect x="90" y="340" width="180" height="72" rx="12" fill="#e9edf7" stroke="#25345f"/><text x="180" y="372" text-anchor="middle">Hartree–Fock</text><text x="180" y="396" text-anchor="middle" font-size="14">mean field; 0% correlation by definition</text><rect x="300" y="285" width="180" height="72" rx="12" fill="#eef2fb" stroke="#25345f"/><text x="390" y="317" text-anchor="middle">MP2 / MPn</text><text x="390" y="341" text-anchor="middle" font-size="14">perturbative dynamic correlation</text><rect x="510" y="225" width="180" height="72" rx="12" fill="#f4f0fb" stroke="#55418c"/><text x="600" y="257" text-anchor="middle">CI / CC</text><text x="600" y="281" text-anchor="middle" font-size="14">systematic excitations; CC size-extensive</text><rect x="720" y="145" width="180" height="84" rx="12" fill="#fbf2dc" stroke="#c09a45"/><text x="810" y="178" text-anchor="middle">CASSCF + PT2/MRCI</text><text x="810" y="202" text-anchor="middle" font-size="14">static + dynamic correlation</text></g><path d="M150 435 L850 95" fill="none" stroke="#8a8f98" stroke-width="3"/><text x="560" y="455" font-family="Arial" font-size="16" fill="#535b68">generally increasing computational cost and wave-function flexibility →</text><text x="60" y="120" transform="rotate(-63 60 120)" font-family="Arial" font-size="16" fill="#535b68">more correlation recovered</text></svg>
