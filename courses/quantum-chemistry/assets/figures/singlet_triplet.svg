<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Singlet and triplet spin states</title><desc id="d">Energy-level style diagram comparing antisymmetric singlet spin state and three symmetric triplet spin states.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#25345f"/></marker></defs><rect width="900" height="420" fill="#fffefa"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#101a37">Two spin-½ particles: coupled spin states</text><line x1="150" y1="330" x2="390" y2="330" stroke="#55418c" stroke-width="4"/><text x="270" y="365" text-anchor="middle" font-family="Arial" font-size="20">Singlet S=0, M<tspan baseline-shift="sub">S</tspan>=0</text><text x="270" y="300" text-anchor="middle" font-family="Arial" font-size="22">( |↑↓⟩ − |↓↑⟩ ) / √2</text><text x="270" y="395" text-anchor="middle" font-family="Arial" font-size="15" fill="#6a7180">antisymmetric spin function</text><line x1="510" y1="165" x2="750" y2="165" stroke="#c09a45" stroke-width="4"/><line x1="510" y1="225" x2="750" y2="225" stroke="#c09a45" stroke-width="4"/><line x1="510" y1="285" x2="750" y2="285" stroke="#c09a45" stroke-width="4"/><text x="630" y="135" text-anchor="middle" font-family="Arial" font-size="20">Triplet S=1</text><text x="630" y="158" text-anchor="middle" font-family="Arial" font-size="17">|↑↑⟩, M<tspan baseline-shift="sub">S</tspan>=+1</text><text x="630" y="218" text-anchor="middle" font-family="Arial" font-size="17">( |↑↓⟩ + |↓↑⟩ ) / √2, M<tspan baseline-shift="sub">S</tspan>=0</text><text x="630" y="278" text-anchor="middle" font-family="Arial" font-size="17">|↓↓⟩, M<tspan baseline-shift="sub">S</tspan>=−1</text><text x="630" y="330" text-anchor="middle" font-family="Arial" font-size="15" fill="#6a7180">symmetric spin functions</text><path d="M420 160C470 130 475 105 500 95" fill="none" stroke="#25345f" stroke-width="2" marker-end="url(#a)"/><text x="430" y="90" font-family="Arial" font-size="15" fill="#25345f">exchange symmetry constrains spatial part</text></svg>
