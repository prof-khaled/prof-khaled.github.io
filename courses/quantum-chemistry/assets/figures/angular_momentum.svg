<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430"><rect width="800" height="430" fill="#fff"/><line x1="260" y1="360" x2="260" y2="55" stroke="#27345f" stroke-width="3"/><text x="275" y="70" font-family="Arial" font-size="20">z</text><ellipse cx="260" cy="205" rx="120" ry="45" fill="none" stroke="#999" stroke-dasharray="7 5"/><line x1="260" y1="330" x2="380" y2="125" stroke="#8b4f92" stroke-width="5"/><polygon points="380,125 365,132 376,143" fill="#8b4f92"/><line x1="260" y1="330" x2="260" y2="125" stroke="#c09a45" stroke-width="4"/><text x="390" y="126" font-family="Arial" font-size="20">|L| = √[l(l+1)]ℏ</text><text x="280" y="150" font-family="Arial" font-size="18">Lz = mℏ</text><path d="M260 125 C330 137 370 165 380 205 C365 250 325 274 260 285" fill="none" stroke="#bbb" stroke-width="2"/><text x="490" y="190" font-family="Arial" font-size="18">Only the projection is sharp</text><text x="490" y="220" font-family="Arial" font-size="18">in an |l,m⟩ eigenstate.</text><text x="490" y="275" font-family="Arial" font-size="18">The vector-cone picture is a</text><text x="490" y="305" font-family="Arial" font-size="18">visual aid, not a classical orbit.</text></svg>