<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-labelledby="t d"><title id="t">Quantum mechanics beyond nonrelativistic wave mechanics</title><desc id="d">Concept map linking tensor products and entanglement, Bell tests, and relativistic Dirac theory.</desc><rect width="980" height="430" fill="#fffefa"/><text x="490" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#101a37">Beyond one-particle Schrödinger mechanics</text><g font-family="Arial"><rect x="365" y="82" width="250" height="72" rx="14" fill="#e9edf7" stroke="#25345f"/><text x="490" y="112" text-anchor="middle" font-size="19">Tensor products &amp; density matrices</text><text x="490" y="136" text-anchor="middle" font-size="14">composite systems • mixed states</text><rect x="80" y="250" width="250" height="84" rx="14" fill="#f4f0fb" stroke="#55418c"/><text x="205" y="282" text-anchor="middle" font-size="19">Entanglement &amp; Bell tests</text><text x="205" y="307" text-anchor="middle" font-size="14">nonclassical correlations; no-signalling</text><rect x="365" y="260" width="250" height="84" rx="14" fill="#fbf2dc" stroke="#c09a45"/><text x="490" y="292" text-anchor="middle" font-size="19">Open interpretation questions</text><text x="490" y="317" text-anchor="middle" font-size="14">Copenhagen • Everett • Bohm • collapse</text><rect x="650" y="250" width="250" height="84" rx="14" fill="#edf8f4" stroke="#176b52"/><text x="775" y="282" text-anchor="middle" font-size="19">Relativistic quantum theory</text><text x="775" y="307" text-anchor="middle" font-size="14">Dirac equation • spinors • antimatter</text><g stroke="#53607d" stroke-width="2.5" fill="none"><path d="M430 154L250 246"/><path d="M490 154L490 255"/><path d="M550 154L730 246"/></g></g><text x="490" y="395" text-anchor="middle" font-family="Arial" font-size="15" fill="#6a7180">These extensions preserve the core linear-algebraic structure while changing the physical questions and state spaces.</text></svg>
