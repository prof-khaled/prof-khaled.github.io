<svg xmlns="http://www.w3.org/2000/svg" width="850" height="430" viewBox="0 0 850 430"><rect width="850" height="430" fill="#fff"/><g stroke="#27345f" stroke-width="4"><line x1="90" y1="330" x2="330" y2="330"/><line x1="90" y1="245" x2="330" y2="245"/><line x1="90" y1="170" x2="330" y2="170"/><line x1="90" y1="105" x2="330" y2="105"/></g><g font-family="Arial" font-size="18"><text x="45" y="335">v=0</text><text x="45" y="250">v=1</text><text x="45" y="175">v=2</text><text x="45" y="110">v=3</text></g><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b4f92"/></marker></defs><line x1="200" y1="320" x2="200" y2="255" stroke="#8b4f92" stroke-width="5" marker-end="url(#ar)"/><text x="360" y="160" font-family="Arial" font-size="19">A transition requires both</text><text x="360" y="190" font-family="Arial" font-size="19">the correct energy gap and</text><text x="360" y="220" font-family="Arial" font-size="19">a non-zero transition moment.</text><text x="360" y="285" font-family="Arial" font-size="18">IR harmonic oscillator: Δv = ±1</text><text x="360" y="315" font-family="Arial" font-size="18">Rigid rotor: ΔJ = ±1</text></svg>