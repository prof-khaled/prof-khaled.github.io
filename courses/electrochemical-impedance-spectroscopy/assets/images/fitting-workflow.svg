<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-labelledby="t d"><title id="t">Equivalent-circuit fitting workflow</title><desc id="d">The workflow links a physical hypothesis to a circuit, parameter bounds, complex nonlinear least squares, residual analysis and model revision.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#0d4b60"/></marker></defs><rect width="980" height="460" rx="28" fill="#eef5f5"/><text x="490" y="50" text-anchor="middle" font-size="30" fill="#092b3a" font-weight="700">Modeling is an evidence cycle, not curve decoration</text><g text-anchor="middle"><rect x="75" y="105" width="220" height="80" rx="18" fill="white" stroke="#0d4b60" stroke-width="3"/><text x="185" y="140" font-size="21">Physical hypothesis</text><text x="185" y="167" font-size="16">processes + geometry</text><rect x="380" y="105" width="220" height="80" rx="18" fill="white" stroke="#0d4b60" stroke-width="3"/><text x="490" y="140" font-size="21">Choose model</text><text x="490" y="167" font-size="16">circuit or transport model</text><rect x="685" y="105" width="220" height="80" rx="18" fill="white" stroke="#0d4b60" stroke-width="3"/><text x="795" y="140" font-size="21">CNLS fit</text><text x="795" y="167" font-size="16">weights + bounds</text><rect x="685" y="280" width="220" height="80" rx="18" fill="#fff0d2" stroke="#8a5b12" stroke-width="3"/><text x="795" y="315" font-size="21">Residuals & uncertainty</text><text x="795" y="342" font-size="16">patterns? confidence?</text><rect x="380" y="280" width="220" height="80" rx="18" fill="#dcebea" stroke="#0d4b60" stroke-width="3"/><text x="490" y="315" font-size="21">Parameter plausibility</text><text x="490" y="342" font-size="16">units, trends, uniqueness</text><rect x="75" y="280" width="220" height="80" rx="18" fill="#dcebea" stroke="#0d4b60" stroke-width="3"/><text x="185" y="315" font-size="21">Independent evidence</text><text x="185" y="342" font-size="16">microscopy, chemistry, tests</text></g><g stroke="#0d4b60" stroke-width="5" marker-end="url(#a)"><line x1="295" y1="145" x2="370" y2="145"/><line x1="600" y1="145" x2="675" y2="145"/><line x1="795" y1="185" x2="795" y2="270"/><line x1="685" y1="320" x2="610" y2="320"/><line x1="380" y1="320" x2="305" y2="320"/></g><path d="M185 280 C185 230 185 220 185 195" fill="none" stroke="#9f2e2e" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#a)"/><text x="230" y="238" font-size="17" fill="#9f2e2e">revise</text></svg>