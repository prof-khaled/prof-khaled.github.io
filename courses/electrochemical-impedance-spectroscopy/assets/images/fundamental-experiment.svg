ddle" font-size="18">RE</text><text x="780" y="325" text-anchor="middle" font-size="18" fill="#0c6f68">CE</text><text x="685" y="395" text-anchor="middle" font-size="21" fill="#092b3a">Sweep frequency → Z(ω)</text></svg>