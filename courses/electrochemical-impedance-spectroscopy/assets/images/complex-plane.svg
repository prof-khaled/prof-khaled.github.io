<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Complex impedance and phasor representation</title><desc id="d">The impedance vector has real and imaginary components, magnitude and phase angle.</desc><rect width="900" height="430" rx="28" fill="#f7f2e7"/><line x1="110" y1="330" x2="790" y2="330" stroke="#092b3a" stroke-width="4"/><line x1="190" y1="380" x2="190" y2="55" stroke="#092b3a" stroke-width="4"/><polygon points="790,330 770,320 770,340" fill="#092b3a"/><polygon points="190,55 180,75 200,75" fill="#092b3a"/><text x="805" y="337" font-size="24" fill="#092b3a">Z′</text><text x="160" y="45" font-size="24" fill="#092b3a">Z″</text><line x1="190" y1="330" x2="650" y2="130" stroke="#0d4b60" stroke-width="7"/><polygon points="650,130 625,132 638,153" fill="#0d4b60"/><line x1="650" y1="130" x2="650" y2="330" stroke="#999" stroke-dasharray="10 8" stroke-width="3"/><line x1="190" y1="130" x2="650" y2="130" stroke="#999" stroke-dasharray="10 8" stroke-width="3"/><path d="M280 330 A90 90 0 0 0 270 294" fill="none" stroke="#c99032" stroke-width="5"/><text x="292" y="294" font-size="23" fill="#8a5b12">φ</text><text x="435" y="205" font-size="28" fill="#0d4b60" font-weight="700">|Z|</text><text x="430" y="358" font-size="22">Z′=|Z| cos φ</text><text x="670" y="225" font-size="22">Z″=|Z| sin φ</text><rect x="80" y="22" width="740" height="55" rx="14" fill="#092b3a"/><text x="450" y="58" text-anchor="middle" fill="white" font-size="25">Z(ω)=Z′+jZ″=|Z|e^{jφ}</text></svg>