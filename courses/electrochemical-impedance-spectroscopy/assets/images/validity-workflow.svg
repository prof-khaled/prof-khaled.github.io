<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-labelledby="t d"><title id="t">EIS data validation workflow</title><desc id="d">A sequence checks linearity, stability, causality and consistency before fitting a model.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#0d4b60"/></marker></defs><rect width="980" height="460" rx="28" fill="#f7f2e7"/><text x="490" y="50" text-anchor="middle" font-size="30" fill="#092b3a" font-weight="700">Validate before interpreting or fitting</text><g font-size="20" text-anchor="middle"><rect x="55" y="160" width="155" height="92" rx="18" fill="#dcebea" stroke="#0d4b60" stroke-width="3"/><text x="132" y="198">1. Linearity</text><text x="132" y="228" font-size="16">amplitude test</text><rect x="245" y="160" width="155" height="92" rx="18" fill="#dcebea" stroke="#0d4b60" stroke-width="3"/><text x="322" y="198">2. Stability</text><text x="322" y="228" font-size="16">repeat / drift</text><rect x="435" y="160" width="155" height="92" rx="18" fill="#dcebea" stroke="#0d4b60" stroke-width="3"/><text x="512" y="198">3. Causality</text><text x="512" y="228" font-size="16">physical response</text><rect x="625" y="160" width="155" height="92" rx="18" fill="#dcebea" stroke="#0d4b60" stroke-width="3"/><text x="702" y="198">4. KK test</text><text x="702" y="228" font-size="16">consistency</text><rect x="815" y="160" width="120" height="92" rx="18" fill="#e7c878" stroke="#8a5b12" stroke-width="3"/><text x="875" y="198">5. Fit</text><text x="875" y="228" font-size="16">residuals</text></g><g stroke="#0d4b60" stroke-width="5" marker-end="url(#a)"><line x1="210" y1="206" x2="240" y2="206"/><line x1="400" y1="206" x2="430" y2="206"/><line x1="590" y1="206" x2="620" y2="206"/><line x1="780" y1="206" x2="810" y2="206"/></g><path d="M700 260 C700 360 322 360 322 265" fill="none" stroke="#9f2e2e" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a)"/><text x="510" y="389" text-anchor="middle" font-size="20" fill="#9f2e2e">Failure → redesign experiment, do not force a model</text><rect x="245" y="80" width="490" height="50" rx="14" fill="#092b3a"/><text x="490" y="113" text-anchor="middle" fill="white" font-size="21">Raw spectrum + metadata + repeated checks</text></svg>