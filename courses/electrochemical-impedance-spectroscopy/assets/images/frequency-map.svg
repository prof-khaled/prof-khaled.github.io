<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-labelledby="t d"><title id="t">Frequency and electrochemical process map</title><desc id="d">A logarithmic frequency axis maps high-frequency wiring and solution response through interfacial kinetics to low-frequency diffusion and drift.</desc><rect width="980" height="430" rx="28" fill="#eef5f5"/><text x="490" y="52" text-anchor="middle" font-size="29" font-weight="700" fill="#092b3a">Frequency separates processes by characteristic time</text><line x1="85" y1="225" x2="895" y2="225" stroke="#092b3a" stroke-width="8"/><polygon points="895,225 870,210 870,240" fill="#092b3a"/><g font-size="18" text-anchor="middle"><text x="110" y="260">10⁻³ Hz</text><text x="300" y="260">1 Hz</text><text x="500" y="260">10² Hz</text><text x="700" y="260">10⁵ Hz</text><text x="875" y="260">10⁷ Hz</text></g><g><rect x="85" y="285" width="210" height="85" rx="18" fill="#e8c87a"/><text x="190" y="319" text-anchor="middle" font-size="21" font-weight="700">Diffusion / drift</text><text x="190" y="348" text-anchor="middle" font-size="17">long experiments</text><rect x="265" y="105" width="250" height="90" rx="18" fill="#9bc8c4"/><text x="390" y="140" text-anchor="middle" font-size="21" font-weight="700">Charge transfer</text><text x="390" y="170" text-anchor="middle" font-size="17">double layer, adsorption</text><rect x="500" y="285" width="210" height="85" rx="18" fill="#a9c6dc"/><text x="605" y="319" text-anchor="middle" font-size="21" font-weight="700">Bulk / solution</text><text x="605" y="348" text-anchor="middle" font-size="17">ohmic and dielectric</text><rect x="695" y="105" width="210" height="90" rx="18" fill="#d8b2b2"/><text x="800" y="140" text-anchor="middle" font-size="21" font-weight="700">Leads / fixtures</text><text x="800" y="170" text-anchor="middle" font-size="17">inductance, capacitance</text></g><text x="490" y="410" text-anchor="middle" font-size="20" fill="#596575">Characteristic time τ ≈ 1/(2πf)</text></svg>