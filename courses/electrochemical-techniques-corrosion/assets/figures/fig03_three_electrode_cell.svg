<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img"><style>
text{font-family:Arial,DejaVu Sans,sans-serif;fill:#10233f} .title{font-size:24px;font-weight:700}.label{font-size:16px}.small{font-size:13px}.axis{stroke:#10233f;stroke-width:2}.gold{stroke:#c6a33a;fill:none;stroke-width:3}.navy{stroke:#10233f;fill:none;stroke-width:3}.cream{fill:#f7f1e3}.bluefill{fill:#dce8f6}.goldfill{fill:#f1e2a6}.red{stroke:#a63d40;fill:none;stroke-width:3}.green{stroke:#2f7d5c;fill:none;stroke-width:3}.dash{stroke-dasharray:8 6}.grid{stroke:#c9d2de;stroke-width:1}.arrow{marker-end:url(#arrow)}
</style><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10233f"/></marker></defs>
<rect width="900" height="520" class="cream"/><text x="450" y="38" text-anchor="middle" class="title">Three-electrode corrosion cell and potentiostat control loop</text>
<rect x="90" y="100" width="720" height="270" rx="18" fill="#dce8f6" stroke="#10233f" stroke-width="3"/><path d="M90 160 Q450 125 810 160" fill="#fff" stroke="#10233f" stroke-width="2"/>
<rect x="170" y="215" width="120" height="115" class="goldfill" stroke="#10233f" stroke-width="2"/><text x="230" y="275" text-anchor="middle" class="label">WE</text><text x="230" y="300" text-anchor="middle" class="small">working electrode</text>
<rect x="610" y="205" width="115" height="125" class="bluefill" stroke="#10233f" stroke-width="2"/><text x="668" y="270" text-anchor="middle" class="label">CE</text><text x="668" y="295" text-anchor="middle" class="small">counter electrode</text>
<path d="M460 155 L460 275 L420 275" class="navy"/><circle cx="400" cy="275" r="20" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="400" y="281" text-anchor="middle" class="label">RE</text><text x="460" y="315" text-anchor="middle" class="small">reference + Luggin tip</text>
<rect x="250" y="405" width="400" height="75" rx="12" fill="#fff" stroke="#c6a33a" stroke-width="3"/><text x="450" y="435" text-anchor="middle" class="label">Potentiostat</text><text x="450" y="460" text-anchor="middle" class="small">controls E(WE−RE), supplies current through CE</text>
<path d="M230 330 L300 405" class="navy arrow"/><path d="M668 330 L600 405" class="red arrow"/><path d="M400 295 L400 405" class="green arrow"/></svg>