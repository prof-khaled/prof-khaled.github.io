<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img"><style>
text{font-family:Arial,DejaVu Sans,sans-serif;fill:#10233f} .title{font-size:24px;font-weight:700}.label{font-size:16px}.small{font-size:13px}.axis{stroke:#10233f;stroke-width:2}.gold{stroke:#c6a33a;fill:none;stroke-width:3}.navy{stroke:#10233f;fill:none;stroke-width:3}.cream{fill:#f7f1e3}.bluefill{fill:#dce8f6}.goldfill{fill:#f1e2a6}.red{stroke:#a63d40;fill:none;stroke-width:3}.green{stroke:#2f7d5c;fill:none;stroke-width:3}.dash{stroke-dasharray:8 6}.grid{stroke:#c9d2de;stroke-width:1}.arrow{marker-end:url(#arrow)}
</style><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10233f"/></marker></defs>
<rect width="900" height="520" class="cream"/><text x="450" y="38" text-anchor="middle" class="title">Advanced in-situ techniques: photocurrent spectroscopy and EQCM</text>
<rect x="70" y="110" width="350" height="310" rx="15" fill="#fff" stroke="#c6a33a" stroke-width="3"/><text x="245" y="145" text-anchor="middle" class="label">Photocurrent spectroscopy</text><path d="M110 250 L180 250" class="gold arrow"/><text x="110" y="225" class="small">monochromatic light</text><rect x="185" y="200" width="80" height="100" fill="#dce8f6" stroke="#10233f" stroke-width="2"/><text x="225" y="255" text-anchor="middle" class="small">passive film</text><path d="M265 250 L350 250" class="red arrow"/><text x="310" y="225" text-anchor="middle" class="small">photocurrent</text><text x="245" y="350" text-anchor="middle" class="small">band gap, conductivity type, flat-band behavior</text>
<rect x="480" y="110" width="350" height="310" rx="15" fill="#fff" stroke="#c6a33a" stroke-width="3"/><text x="655" y="145" text-anchor="middle" class="label">Electrochemical quartz crystal microbalance</text><ellipse cx="655" cy="260" rx="120" ry="38" fill="#dce8f6" stroke="#10233f" stroke-width="3"/><ellipse cx="655" cy="245" rx="80" ry="20" fill="#f1e2a6" stroke="#a63d40" stroke-width="2"/><path d="M535 260 L500 210" class="navy"/><path d="M775 260 L810 210" class="navy"/><text x="655" y="330" text-anchor="middle" class="small">frequency shift ↔ interfacial mass change</text><text x="655" y="370" text-anchor="middle" class="small">adsorption, dissolution, passive-film growth</text></svg>