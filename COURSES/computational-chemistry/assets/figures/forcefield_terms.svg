<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img">
<style>text{font-family:Arial,sans-serif;fill:#10243e}.t{font-size:28px;font-weight:700}.s{font-size:20px}.box{fill:#f7f2e8;stroke:#c7a85b;stroke-width:3}.navy{fill:#10243e}.gold{fill:#c7a85b}.line{stroke:#10243e;stroke-width:4;fill:none}.dash{stroke:#778;stroke-width:3;fill:none;stroke-dasharray:10 8}</style>
<text x="500" y="45" text-anchor="middle" class="t">Classical force-field energy decomposition</text>
<circle cx="500" cy="280" r="90" fill="#fff" stroke="#10243e" stroke-width="4"/><text x="500" y="270" text-anchor="middle" class="t">Etotal</text><text x="500" y="305" text-anchor="middle" class="s">Σ energetic terms</text>
<g><rect x="60" y="95" width="250" height="90" rx="20" class="box"/><text x="185" y="132" text-anchor="middle" class="s">Bond stretching</text><text x="185" y="160" text-anchor="middle" class="s">½kᵣ(r−r₀)²</text>
<rect x="690" y="95" width="250" height="90" rx="20" class="box"/><text x="815" y="132" text-anchor="middle" class="s">Angle bending</text><text x="815" y="160" text-anchor="middle" class="s">½kθ(θ−θ₀)²</text>
<rect x="55" y="375" width="260" height="90" rx="20" class="box"/><text x="185" y="412" text-anchor="middle" class="s">Torsions</text><text x="185" y="440" text-anchor="middle" class="s">ΣVₙ[1+cos(nφ−δ)]</text>
<rect x="685" y="375" width="260" height="90" rx="20" class="box"/><text x="815" y="412" text-anchor="middle" class="s">Nonbonded</text><text x="815" y="440" text-anchor="middle" class="s">LJ + Coulomb</text></g>
<path d="M310 160L425 225 M690 160L575 225 M315 410L425 335 M685 410L575 335" class="line"/>
<text x="500" y="525" text-anchor="middle" class="s">Parameters define the model's chemical domain; transferability is useful but never unlimited.</text></svg>