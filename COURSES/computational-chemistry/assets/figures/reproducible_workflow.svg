<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img">
<style>text{font-family:Arial,sans-serif;fill:#10243e}.t{font-size:28px;font-weight:700}.s{font-size:20px}.box{fill:#f7f2e8;stroke:#c7a85b;stroke-width:3}.navy{fill:#10243e}.gold{fill:#c7a85b}.line{stroke:#10243e;stroke-width:4;fill:none}.dash{stroke:#778;stroke-width:3;fill:none;stroke-dasharray:10 8}</style>
<text x="500" y="45" text-anchor="middle" class="t">Reproducible computational chemistry workflow</text>
<g class="s"><rect x="50" y="160" width="160" height="90" rx="18" class="box"/><text x="130" y="195" text-anchor="middle">Question</text><text x="130" y="222" text-anchor="middle">observable + error target</text>
<rect x="245" y="160" width="160" height="90" rx="18" class="box"/><text x="325" y="195" text-anchor="middle">Model</text><text x="325" y="222" text-anchor="middle">method + basis + solvent</text>
<rect x="440" y="160" width="160" height="90" rx="18" class="box"/><text x="520" y="195" text-anchor="middle">Compute</text><text x="520" y="222" text-anchor="middle">inputs + versions + hardware</text>
<rect x="635" y="160" width="160" height="90" rx="18" class="box"/><text x="715" y="195" text-anchor="middle">Validate</text><text x="715" y="222" text-anchor="middle">convergence + benchmarks</text>
<rect x="830" y="160" width="120" height="90" rx="18" class="box"/><text x="890" y="195" text-anchor="middle">Report</text><text x="890" y="222" text-anchor="middle">data + uncertainty</text></g>
<path d="M210 205H245 M405 205H440 M600 205H635 M795 205H830" class="line"/>
<rect x="245" y="340" width="550" height="95" rx="18" fill="#fff" stroke="#10243e" stroke-width="3"/><text x="520" y="375" text-anchor="middle" class="s">Archive: structures, input/output, scripts, provenance, units, failed jobs, analysis choices</text><text x="520" y="407" text-anchor="middle" class="s">Use stable identifiers and machine-readable metadata where possible.</text>
<path d="M520 250V340" class="line"/><text x="500" y="520" text-anchor="middle" class="s">A result without a model specification and provenance trail cannot be independently reproduced.</text></svg>