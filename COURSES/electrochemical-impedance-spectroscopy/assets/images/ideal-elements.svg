<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" role="img" aria-labelledby="t d"><title id="t">Ideal impedance elements</title><desc id="d">Resistor, capacitor and inductor symbols with their impedance equations and phase behavior.</desc><rect width="980" height="440" rx="28" fill="#eef5f5"/><text x="490" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#092b3a">Ideal elements in the frequency domain</text><g transform="translate(55 95)"><rect width="270" height="285" rx="22" fill="white" stroke="#9db9bf" stroke-width="3"/><text x="135" y="42" text-anchor="middle" font-size="26" fill="#092b3a" font-weight="700">Resistor R</text><line x1="35" y1="105" x2="75" y2="105" stroke="#092b3a" stroke-width="5"/><path d="M75 105 l15 -24 30 48 30 -48 30 48 30 -48 15 24" fill="none" stroke="#092b3a" stroke-width="5"/><line x1="225" y1="105" x2="245" y2="105" stroke="#092b3a" stroke-width="5"/><text x="135" y="170" text-anchor="middle" font-size="25">Z_R=R</text><text x="135" y="215" text-anchor="middle" font-size="21">φ=0°</text><text x="135" y="255" text-anchor="middle" font-size="18" fill="#596575">frequency independent</text></g><g transform="translate(355 95)"><rect width="270" height="285" rx="22" fill="white" stroke="#9db9bf" stroke-width="3"/><text x="135" y="42" text-anchor="middle" font-size="26" fill="#092b3a" font-weight="700">Capacitor C</text><line x1="35" y1="105" x2="112" y2="105" stroke="#092b3a" stroke-width="5"/><line x1="112" y1="72" x2="112" y2="138" stroke="#092b3a" stroke-width="6"/><line x1="158" y1="72" x2="158" y2="138" stroke="#092b3a" stroke-width="6"/><line x1="158" y1="105" x2="245" y2="105" stroke="#092b3a" stroke-width="5"/><text x="135" y="170" text-anchor="middle" font-size="25">Z_C=1/(jωC)</text><text x="135" y="215" text-anchor="middle" font-size="21">φ=−90°</text><text x="135" y="255" text-anchor="middle" font-size="18" fill="#596575">|Z| decreases with f</text></g><g transform="translate(655 95)"><rect width="270" height="285" rx="22" fill="white" stroke="#9db9bf" stroke-width="3"/><text x="135" y="42" text-anchor="middle" font-size="26" fill="#092b3a" font-weight="700">Inductor L</text><line x1="35" y1="105" x2="70" y2="105" stroke="#092b3a" stroke-width="5"/><path d="M70 105 q15 -40 30 0 q15 -40 30 0 q15 -40 30 0 q15 -40 30 0 q15 -40 30 0" fill="none" stroke="#092b3a" stroke-width="5"/><line x1="220" y1="105" x2="245" y2="105" stroke="#092b3a" stroke-width="5"/><text x="135" y="170" text-anchor="middle" font-size="25">Z_L=jωL</text><text x="135" y="215" text-anchor="middle" font-size="21">φ=+90°</text><text x="135" y="255" text-anchor="middle" font-size="18" fill="#596575">|Z| increases with f</text></g></svg>