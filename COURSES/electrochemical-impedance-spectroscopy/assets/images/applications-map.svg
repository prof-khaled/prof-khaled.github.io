<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="t d"><title id="t">Applications of electrochemical impedance spectroscopy</title><desc id="d">A central EIS node connects corrosion, coatings, batteries, fuel cells, solid electrolytes, sensors, biomedical systems and polymers.</desc><rect width="980" height="500" rx="28" fill="#f7f2e7"/><circle cx="490" cy="250" r="105" fill="#092b3a"/><text x="490" y="238" text-anchor="middle" fill="#f0c56d" font-size="38" font-weight="800">EIS</text><text x="490" y="275" text-anchor="middle" fill="white" font-size="19">frequency-resolved</text><text x="490" y="300" text-anchor="middle" fill="white" font-size="19">system identification</text><g stroke="#0d4b60" stroke-width="4"><line x1="407" y1="185" x2="235" y2="92"/><line x1="573" y1="185" x2="745" y2="92"/><line x1="388" y1="250" x2="180" y2="250"/><line x1="592" y1="250" x2="800" y2="250"/><line x1="407" y1="315" x2="235" y2="408"/><line x1="573" y1="315" x2="745" y2="408"/></g><g text-anchor="middle" font-size="20" font-weight="700"><rect x="110" y="45" width="250" height="80" rx="18" fill="#dcebea"/><text x="235" y="80">Corrosion & coatings</text><text x="235" y="107" font-size="16" font-weight="400">films, water uptake, rate</text><rect x="620" y="45" width="250" height="80" rx="18" fill="#dcebea"/><text x="745" y="80">Batteries & fuel cells</text><text x="745" y="107" font-size="16" font-weight="400">kinetics, transport, aging</text><rect x="40" y="210" width="250" height="80" rx="18" fill="#fff0d2"/><text x="165" y="245">Materials & dielectrics</text><text x="165" y="272" font-size="16" font-weight="400">bulk, grains, interfaces</text><rect x="690" y="210" width="250" height="80" rx="18" fill="#fff0d2"/><text x="815" y="245">Sensors & biomedical</text><text x="815" y="272" font-size="16" font-weight="400">binding, cells, implants</text><rect x="110" y="375" width="250" height="80" rx="18" fill="#dcebea"/><text x="235" y="410">Polymers & colloids</text><text x="235" y="437" font-size="16" font-weight="400">relaxation, conductivity</text><rect x="620" y="375" width="250" height="80" rx="18" fill="#dcebea"/><text x="745" y="410">Local & nonlinear EIS</text><text x="745" y="437" font-size="16" font-weight="400">spatial and harmonic detail</text></g></svg>