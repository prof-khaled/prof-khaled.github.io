<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430"><rect width="800" height="430" fill="#fff"/><circle cx="290" cy="215" r="145" fill="#f7f5fb" stroke="#27345f" stroke-width="3"/><ellipse cx="290" cy="215" rx="145" ry="45" fill="none" stroke="#999" stroke-dasharray="7 6"/><line x1="290" y1="360" x2="290" y2="58" stroke="#27345f" stroke-width="2"/><line x1="140" y1="215" x2="440" y2="215" stroke="#27345f" stroke-width="2"/><line x1="185" y1="320" x2="400" y2="105" stroke="#bbb" stroke-width="2"/><line x1="290" y1="215" x2="385" y2="115" stroke="#8b4f92" stroke-width="5"/><polygon points="385,115 370,121 379,133" fill="#8b4f92"/><text x="397" y="112" font-family="Arial" font-size="22" fill="#27345f">|ψ⟩</text><text x="302" y="70" font-family="Arial" font-size="20">|0⟩</text><text x="302" y="355" font-family="Arial" font-size="20">|1⟩</text><text x="490" y="130" font-family="Arial" font-size="20" fill="#27345f">A normalized two-state vector</text><text x="490" y="165" font-family="Arial" font-size="17">Global phase does not change</text><text x="490" y="190" font-family="Arial" font-size="17">measurement probabilities.</text><text x="490" y="240" font-family="Arial" font-size="17">A basis change changes coordinates,</text><text x="490" y="265" font-family="Arial" font-size="17">not the physical state.</text><text x="490" y="315" font-family="Arial" font-size="17">Projective measurement selects</text><text x="490" y="340" font-family="Arial" font-size="17">an eigenstate with Born probability.</text></svg>