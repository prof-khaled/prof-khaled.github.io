<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"><rect width="900" height="430" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#27345f"/></marker></defs><g font-family="Arial" font-size="18" text-anchor="middle"><rect x="45" y="165" width="145" height="70" rx="12" fill="#eef1f8" stroke="#27345f"/><text x="118" y="195">Initial orbitals</text><text x="118" y="218">or density P</text><rect x="245" y="165" width="145" height="70" rx="12" fill="#eef1f8" stroke="#27345f"/><text x="318" y="195">Build Fock</text><text x="318" y="218">matrix F[P]</text><rect x="445" y="165" width="145" height="70" rx="12" fill="#eef1f8" stroke="#27345f"/><text x="518" y="195">Solve FC=SCε</text><text x="518" y="218">new orbitals</text><rect x="645" y="165" width="175" height="70" rx="12" fill="#eef1f8" stroke="#27345f"/><text x="733" y="195">Build new density</text><text x="733" y="218">and test ΔE, ΔP</text></g><g stroke="#27345f" stroke-width="3" fill="none" marker-end="url(#a)"><line x1="190" y1="200" x2="245" y2="200"/><line x1="390" y1="200" x2="445" y2="200"/><line x1="590" y1="200" x2="645" y2="200"/><path d="M733 235 C735 340 320 350 310 240"/></g><text x="510" y="365" font-family="Arial" font-size="18">iterate until self-consistent; convergence does not guarantee the physically desired solution</text></svg>