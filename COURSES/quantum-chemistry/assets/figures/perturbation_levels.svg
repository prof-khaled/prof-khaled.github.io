<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Perturbation theory energy shifts</title><desc id="d">Unperturbed and perturbed energy levels with first-order shifts and degeneracy splitting.</desc><rect width="900" height="430" fill="#fffefa"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#101a37">Perturbation theory: energy corrections and splitting</text><text x="225" y="80" text-anchor="middle" font-family="Arial" font-size="18">H⁽⁰⁾</text><text x="675" y="80" text-anchor="middle" font-family="Arial" font-size="18">H = H⁽⁰⁾ + λV</text><g stroke="#25345f" stroke-width="4"><line x1="120" y1="330" x2="330" y2="330"/><line x1="120" y1="245" x2="330" y2="245"/><line x1="120" y1="155" x2="330" y2="155"/></g><g stroke="#c09a45" stroke-width="4"><line x1="570" y1="315" x2="780" y2="315"/><line x1="570" y1="224" x2="780" y2="224"/><line x1="570" y1="184" x2="780" y2="184"/></g><g stroke="#888" stroke-width="1.5" stroke-dasharray="6 5"><line x1="330" y1="330" x2="570" y2="315"/><line x1="330" y1="245" x2="570" y2="224"/><line x1="330" y1="155" x2="570" y2="184"/></g><text x="340" y="142" font-family="Arial" font-size="15">degenerate subspace</text><path d="M330 155 C420 130 490 160 570 184" fill="none" stroke="#55418c" stroke-width="2"/><path d="M330 155 C420 180 490 210 570 224" fill="none" stroke="#55418c" stroke-width="2"/><text x="675" y="360" text-anchor="middle" font-family="Arial" font-size="16">Eₙ⁽¹⁾ = ⟨n⁽⁰⁾|V|n⁽⁰⁾⟩</text><text x="675" y="390" text-anchor="middle" font-family="Arial" font-size="15" fill="#6a7180">Degenerate states require diagonalizing V inside the degenerate subspace.</text></svg>
