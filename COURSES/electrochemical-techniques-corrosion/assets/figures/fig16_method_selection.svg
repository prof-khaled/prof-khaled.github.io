<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img"><style>
text{font-family:Arial,DejaVu Sans,sans-serif;fill:#10233f} .title{font-size:24px;font-weight:700}.label{font-size:16px}.small{font-size:13px}.axis{stroke:#10233f;stroke-width:2}.gold{stroke:#c6a33a;fill:none;stroke-width:3}.navy{stroke:#10233f;fill:none;stroke-width:3}.cream{fill:#f7f1e3}.bluefill{fill:#dce8f6}.goldfill{fill:#f1e2a6}.red{stroke:#a63d40;fill:none;stroke-width:3}.green{stroke:#2f7d5c;fill:none;stroke-width:3}.dash{stroke-dasharray:8 6}.grid{stroke:#c9d2de;stroke-width:1}.arrow{marker-end:url(#arrow)}
</style><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10233f"/></marker></defs>
<rect width="900" height="560" class="cream"/><text x="450" y="38" text-anchor="middle" class="title">Technique-selection logic for corrosion problems</text>
<rect x="310" y="70" width="280" height="55" rx="10" fill="#10233f"/><text x="450" y="104" text-anchor="middle" style="font-family:Arial;fill:white;font-size:17px">What information is required?</text>
<path d="M450 125 L450 165" class="navy arrow"/>
<rect x="55" y="175" width="185" height="70" rx="10" class="goldfill" stroke="#10233f"/><text x="147" y="205" text-anchor="middle" class="label">rate near OCP</text><text x="147" y="230" text-anchor="middle" class="small">LPR / EIS / EN</text>
<rect x="260" y="175" width="185" height="70" rx="10" class="bluefill" stroke="#10233f"/><text x="352" y="205" text-anchor="middle" class="label">critical potentials</text><text x="352" y="230" text-anchor="middle" class="small">polarization / CPP</text>
<rect x="465" y="175" width="185" height="70" rx="10" class="goldfill" stroke="#10233f"/><text x="557" y="205" text-anchor="middle" class="label">interfaces & films</text><text x="557" y="230" text-anchor="middle" class="small">EIS / EQCM / PCS</text>
<rect x="670" y="175" width="185" height="70" rx="10" class="bluefill" stroke="#10233f"/><text x="762" y="205" text-anchor="middle" class="label">spatial localization</text><text x="762" y="230" text-anchor="middle" class="small">SVET / SECM / SKP</text>
<path d="M450 125 C300 145 150 150 147 175" class="navy arrow"/><path d="M450 125 C400 145 355 150 352 175" class="navy arrow"/><path d="M450 125 C500 145 555 150 557 175" class="navy arrow"/><path d="M450 125 C600 145 750 150 762 175" class="navy arrow"/>
<rect x="140" y="310" width="620" height="80" rx="12" fill="#fff" stroke="#c6a33a" stroke-width="3"/><text x="450" y="340" text-anchor="middle" class="label">Then check validity conditions</text><text x="450" y="370" text-anchor="middle" class="small">stationarity • linearity • area • solution resistance • mass transport • reference stability • surface history</text>
<path d="M450 245 L450 310" class="navy arrow"/><rect x="210" y="445" width="480" height="65" rx="12" fill="#dbeadf" stroke="#2f7d5c" stroke-width="3"/><text x="450" y="475" text-anchor="middle" class="label">Use at least one complementary method for validation</text><text x="450" y="500" text-anchor="middle" class="small">electrochemical + surface/chemical + gravimetric/field evidence</text><path d="M450 390 L450 445" class="navy arrow"/></svg>