<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img"><style>
text{font-family:Arial,DejaVu Sans,sans-serif;fill:#10233f} .title{font-size:24px;font-weight:700}.label{font-size:16px}.small{font-size:13px}.axis{stroke:#10233f;stroke-width:2}.gold{stroke:#c6a33a;fill:none;stroke-width:3}.navy{stroke:#10233f;fill:none;stroke-width:3}.cream{fill:#f7f1e3}.bluefill{fill:#dce8f6}.goldfill{fill:#f1e2a6}.red{stroke:#a63d40;fill:none;stroke-width:3}.green{stroke:#2f7d5c;fill:none;stroke-width:3}.dash{stroke-dasharray:8 6}.grid{stroke:#c9d2de;stroke-width:1}.arrow{marker-end:url(#arrow)}
</style><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10233f"/></marker></defs>
<rect width="900" height="520" class="cream"/><text x="450" y="42" text-anchor="middle" class="title">Four requirements for electrochemical corrosion</text>
<rect x="90" y="115" width="220" height="90" rx="12" class="goldfill" stroke="#10233f" stroke-width="2"/><text x="200" y="150" text-anchor="middle" class="label">ANODE / المصعد</text><text x="200" y="177" text-anchor="middle" class="small">M → Mⁿ⁺ + ne⁻</text>
<rect x="590" y="115" width="220" height="90" rx="12" class="bluefill" stroke="#10233f" stroke-width="2"/><text x="700" y="150" text-anchor="middle" class="label">CATHODE / المهبط</text><text x="700" y="177" text-anchor="middle" class="small">Ox + ne⁻ → Red</text>
<path d="M310 145 C420 70 480 70 590 145" class="navy arrow"/><text x="450" y="88" text-anchor="middle" class="label">electron path / مسار الإلكترونات</text>
<path d="M590 190 C500 300 400 300 310 190" class="gold arrow"/><text x="450" y="292" text-anchor="middle" class="label">ionic path through electrolyte / مسار أيوني في الإلكتروليت</text>
<path d="M200 205 L200 390" class="red arrow"/><text x="220" y="350" class="small">metal dissolution</text><path d="M700 205 L700 390" class="green arrow"/><text x="720" y="350" class="small">reduction reaction</text>
<rect x="110" y="390" width="680" height="62" rx="12" fill="#fff" stroke="#c6a33a" stroke-width="3"/><text x="450" y="420" text-anchor="middle" class="label">Remove or slow any one requirement to mitigate corrosion</text><text x="450" y="443" text-anchor="middle" class="small">تعطيل أو إبطاء أي عنصر من هذه العناصر يحد من التآكل</text></svg>